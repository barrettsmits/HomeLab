# jenkins_configuration.yml
- name: Configure Jenkins
  hosts: jenkins_prd
  become_user: root
  become: true
  vars_files:
    - ~/secrets/creds.yml
    # become_password: "{{ become_password }}"
  tasks:
    # Add these pre-tasks at the beginning
    - name: Install python3-pip
      apt:
        name: python3-pip
        state: present
      become: true

    - name: Install python-jenkins module
      pip:
        name: python-jenkins
        state: present
      become: true

    # JENKINS STARTUP CHECK
    - name: Wait for Jenkins to start up
      uri:
        url: http://localhost:8080
        status_code:
          - 200
          - 403  # Adding 403 as acceptable status code since it means Jenkins is up but requires auth
      register: result
      until: result.status in [200, 403]
      retries: 60
      delay: 5

    - name: Check if initial admin password file exists
      stat:
        path: /var/lib/jenkins/secrets/initialAdminPassword
      register: initial_password_file

    - name: Get Jenkins initial admin password from file
      command: cat /var/lib/jenkins/secrets/initialAdminPassword
      register: jenkins_admin_password
      changed_when: false
      when: initial_password_file.stat.exists
      ignore_errors: true

    - name: Use vault password if initial password doesn't exist
      set_fact:
        jenkins_admin_password:
          stdout: "{{ vault_jenkins_admin_password }}"
      when: not initial_password_file.stat.exists or jenkins_admin_password is failed

    #JENKINS PLUGINS
    - name: Install Jenkins plugins
      jenkins_plugin:
        name: "{{ item }}"
        jenkins_home: /var/lib/jenkins
        url_username: admin
        url_password: "{{ jenkins_admin_password.stdout }}"
      with_items:
        - workflow-aggregator  # Pipeline plugin
        - git
        - ansible
        - credentials
        - ssh-credentials
        - ssh-agent
        - docker-workflow
        - kubernetes
        - blueocean
        - matrix-auth
        - role-strategy
        - timestamper
        - pipeline-stage-view
        - junit
        - warnings-ng
        - dashboard-view

    # JENKINS SECURITY
    - name: Configure Jenkins security
      jenkins_script:
        script: |
          import jenkins.model.*
          import hudson.security.*
          def instance = Jenkins.getInstance()
          def strategy = new FullControlOnceLoggedInAuthorizationStrategy()
          instance.setAuthorizationStrategy(strategy)
          instance.save()
        user: admin
        password: "{{ jenkins_admin_password.stdout }}"

    # CHECK IF KEY PAIR EXISTS IN ROOT .SSH
    - name: Check if key pair exists
      command: |
        ssh-keygen -l -f ~/.ssh/jenkins_key.pub
      register: key_pair_check
      changed_when: false
      ignore_errors: true
      
    - name: Create key pair if it doesn't exist
      command: |
        ssh-keygen -t ed25519 -C "Jenkins key pair" -f ~/.ssh/jenkins_key -N ""
      when: key_pair_check.rc is defined and key_pair_check.rc != 0
      register: key_pair_creation
      changed_when: true

    - name: Add key pair to authorized_keys
      lineinfile:
        path: ~/.ssh/authorized_keys
        line: "{{ lookup('file', '~/.ssh/jenkins_key.pub') }}"
        create: yes
      when: key_pair_check.rc is defined and key_pair_check.rc != 0

    - name: Copy public key to Jenkins
      copy:
        src: ~/.ssh/jenkins_key.pub
        dest: /tmp/jenkins_key.pub
        owner: jenkins
        group: jenkins
        mode: '0644'
        remote_src: yes
      
    # Add the private key to Jenkins credentials
    - name: Create Jenkins credentials directory if it doesn't exist
      file:
        path: /var/lib/jenkins/credentials
        state: directory
        owner: jenkins
        group: jenkins
        mode: '0700'
          
    - name: Create Jenkins .ssh directory if it doesn't exist
      file:
        path: /var/lib/jenkins/.ssh
        state: directory
        owner: jenkins
        group: jenkins
        mode: '0700'

    - name: Copy private key to Jenkins
      copy:
        src: ~/.ssh/jenkins_key
        dest: /var/lib/jenkins/.ssh/jenkins_key
        owner: jenkins
        group: jenkins
        mode: '0600'
        remote_src: yes
      register: jenkins_key_copy
      
    # Add the SSH key to Jenkins credentials store
    - name: Add SSH key to Jenkins credentials
      jenkins_script:
        script: |
          import jenkins.model.*
          import com.cloudbees.plugins.credentials.*
          import com.cloudbees.plugins.credentials.domains.*
          import com.cloudbees.jenkins.plugins.sshcredentials.impl.*
          import hudson.plugins.sshslaves.verification.*
          
          def jenkins = Jenkins.getInstance()
          def domain = Domain.global()
          def store = jenkins.getExtensionList('com.cloudbees.plugins.credentials.SystemCredentialsProvider')[0].getStore()
          
          def privateKey = new BasicSSHUserPrivateKey.DirectEntryPrivateKeySource(
            new File('/var/lib/jenkins/.ssh/jenkins_key').text
          )
          
          def credentials = new BasicSSHUserPrivateKey(
            CredentialsScope.GLOBAL,
            'jenkins-ssh-key',
            'jenkins',
            privateKey,
            '',
            'Jenkins SSH Key for Pipelines'
          )
          
          // Remove existing credentials with the same ID if they exist
          def existingCredentials = store.getCredentials(domain).find { it.id == 'jenkins-ssh-key' }
          if (existingCredentials) {
            store.removeCredentials(domain, existingCredentials)
          }
          
          store.addCredentials(domain, credentials)
        user: admin
        password: "{{ jenkins_admin_password.stdout }}"
      when: jenkins_key_copy is changed or key_pair_creation is changed

    # PIPELINE SETUP
    - name: Create Proxmox management pipeline
      jenkins_job:
        config: "{{ lookup('template', 'templates/proxmox-pipeline.xml.j2') }}"
        name: "proxmox-management"
        password: "{{ jenkins_admin_password.stdout }}"
        url: http://localhost:8080
        user: admin

    # BACKUP CONFIGURATION
    - name: Configure Jenkins backup job
      jenkins_job:
        config: "{{ lookup('template', 'templates/jenkins-backup.xml.j2') }}"
        name: "jenkins-backup"
        password: "{{ jenkins_admin_password.stdout }}"
        url: http://localhost:8080
        user: admin 
    
    # SIMPLE Pipeline
    - name: Create simple pipeline
      jenkins_job:
        config: "{{ lookup('template', 'templates/simple-pipeline.xml.j2') }}"
        name: "simple-pipeline"
        password: "{{ jenkins_admin_password.stdout }}"
        url: http://localhost:8080
        user: admin
    
    # JENKINS restart
    - name: Restart Jenkins
      command: |
        systemctl restart jenkins